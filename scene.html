        } */

  let _target = 0.85;

  Object.defineProperty(window, 'target', {
    get() {

      return _target;
    },
    set(value) {
      // console.log(_target);
      _target = value;
      // this code runs whenever window.zoom changes
      var headerHeight = 27;
      if (window.isMobile) headerHeight = 40;
      if (value == 'CANVAS') {
        subcontainer.style.transform = `translateY(calc(100% - ${headerHeight}%))`;
        button.textContent = "Expand";
        isOpen = false;
      } else if (value == 'DIV') {
        subcontainer.style.transform = `translateY(0)`;
        button.textContent = "Hide";
        isOpen = true;
      }

    }
  });

  window.expandSubContainer = function () {
    if (!isOpen) {
      subcontainer.style.transform = "translateY(0)";
      button.textContent = "Hide";
      isOpen = true;
    }
  }

  window.hideSubContainer = function () {
    const subcontainer = document.getElementById("sub_container");
    var headerHeight = 27;
    if (window.isMobile) headerHeight = 40;
    if (isOpen) {
      subcontainer.style.transform = `translateY(calc(100% - ${headerHeight}%))`;
      button.textContent = "Expand";
      isOpen = false;
    }
