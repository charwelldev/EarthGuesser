<!doctype html>

<head>

</head>

<body class="font-raleway bg-scenebackgroundcolor">

  <div class="md:flex md:flex-row bg-scenebackgroundcolor flex-col block" id="main_container">

    <div id="sub_container"
      class="md:bg-scenebackgroundcolor md:w-1/4 md:max-h-full md:flex md:flex-col md:items-center md:justify-center hidden">

      <div
        class="p-4 w-full bg-scenebackgroundcolor border-2 border-cyansky border-solid rounded-lg md:flex md:flex-row md:justify-between md:mb-6 ">
        <div class="flex flex-row md:flex-1 justify-center">
          <a href="/" class="-m-1.5 p-1.5">
            <!-- <img class="h-1/3 w-auto" src="./assets/logo-def.png" alt=""> -->

            <ul class="inline-block text-3xl text-transparent bg-conic-180 from-bluesky to-cyansky bg-clip-text">
              <li class="inline-block">Ge</li>
              <li class="inline-block oval-gradient"></li>
              <li class="inline-block">graphy Guessr</li>
            </ul>
          </a>
        </div>

      </div>

      <div
        class="p-2 w-full bg-scenebackgroundcolor border-2 border-cyansky text-center border-solid rounded-lg flex flex-row justify-between mb-6">
        <div class="text-xl text-bluesky">
          Remaining attempts: </div>
        <div class="text-xl text-red-500" id="countTries">9
        </div>
      </div>
      <div
        class="overflow-y-clip p-4 w-full bg-scenebackgroundcolor border-2 border-cyansky border-solid rounded-lg md:flex md:flex-col md:justify-between md:mb-6">
        <div class="text-2xl text-center text-bluesky">
          Guess each country, on the globe, for each clue</div>

        <!-- <span class="text-4xl text-center bg-gradient-to-t from-gray-600 to-cyansky bg-clip-text text-transparent mt-4"></span> -->

        <div class="flex flex-row justify-center">
          <div class="flex flex-col justify-center p-2 text-1xl rounded-lg m-2" id="questions">
            <div class="flex flex-row justify-between">
              <div id="q0"
                class="mt-2 mb-2 p-2 rounded-lg border-1 border-amber-50 bg-scenebackgroundcolor text-white flex flex-row justify-items-center">
              </div>
              <div id="q0a"
                class="hidden mt-2 mb-2 p-2 rounded-lg border-1 border-amber-50 bg-scenebackgroundcolor text-white">
              </div>
            </div>
            <div class="flex flex-row justify-between">
              <div id="q1"
                class="mt-2 mb-2 p-2 rounded-lg border-1 border-amber-50 bg-scenebackgroundcolor text-white flex flex-row justify-items-center">
              </div>
              <div id="q1a"
                class="hidden mt-2 mb-2 p-2 rounded-lg border-1 border-amber-50 bg-scenebackgroundcolor text-white">
              </div>
            </div>
            <div class="flex flex-row justify-between">
              <div id="q2"
                class="mt-2 mb-2 p-2 rounded-lg border-1 border-amber-50 bg-scenebackgroundcolor text-white flex flex-row justify-items-center">
              </div>
              <div id="q2a"
                class="hidden mt-2 mb-2 p-2 rounded-lg border-1 border-amber-50 bg-scenebackgroundcolor text-white">
              </div>
            </div>
            <div class="flex flex-row justify-between">
              <div id="q3"
                class="mt-2 mb-2 p-2 rounded-lg border-1 border-amber-50 bg-scenebackgroundcolor text-white flex flex-row justify-items-center">
              </div>
              <div id="q3a"
                class="hidden mt-2 mb-2 p-2 rounded-lg border-1 border-amber-50 bg-scenebackgroundcolor text-whiter">
              </div>
            </div>
          </div>
          <ul class="mt-2 justify-between" id="answers">
            <!-- Dynamically generated -->
          </ul>
        </div>
        <div id="results"
          class="text-xl text-center bg-gradient-to-r from-cyansky to-bluesky bg-clip-text text-transparent mt-4 mb-4"
          style="visibility: hidden;">
          Score<br> </div>
      </div>
      <div
      class="p-2 w-full bg-scenebackgroundcolor border-2 border-cyansky text-center border-solid rounded-lg flex flex-row justify-between mb-6">
      <div class="text-xl text-center text-bluesky">
        Last country selected: </div>
      <div class="text-xl text-white" id="lastCountrySelected"> - 
      </div>
    </div>
    </div>


    <div id="earthCanvas" class="w-full h-full md:w-3/4 relative">
      <div class="md:hidden absolute top-0 left-0 z-10 bg-scenebackgroundcolor rounded-br-sm flex flex-col p-4"
        id="answers-container">
        <ul class="inline-block text-3xl text-transparent bg-conic-180 from-bluesky to-cyansky bg-clip-text mb-2">
          <li class="inline-block">Geography</li>
          <li class="inline-block oval-gradient-mobile"></li>
          <li class="inline-block">Guessr</li>
        </ul>
        <div class="text-xl text-white " id="triesCountMobile">Remaining attempts: 9</div>
        <div class="text-xl text-white " id="lastCountrySelectedMobile">Last selected country: </div>
        
      </div>
      <div class="absolute top-0 right-0 z-10" id="gui-container"></div>
      <div id="loader" class="absolute top-0 left-0 w-full h-full flex justify-center items-center z-50 flex-shrink-0">
        <div class="spinner"></div>
      </div>
      <div class="md:hidden absolute bottom-0 w-full z-10 bg-scenebackgroundcolor rounded-tr-sm flex flex-col p-4">
        <div class="text-2xl text-white mb-4 text-center">Guess each country, for each clue</div>
        <button id="toggleButton" class="text-xl text-white bg-blue-600 px-4 py-2 mb-2 rounded hover:bg-blue-700">Hide clues</button>
        <div class="text-md text-black p-2 clue rounded bg-gray-50 m-2" id="clue0"></div>
        <div class="text-md text-black p-2 clue bg-gray-50 m-2" id="clue1"></div>
        <div class="text-md text-black p-2 clue bg-gray-50 m-2" id="clue2"></div>
        <div class="text-md text-black p-2 clue bg-gray-50 m-2" id="clue3"></div>
        <div class="text-2xl text-white border-b-2 border-amber-50">Score</div>
        <div class="text-md text-white " id="resultsMobile"></div>
    </div>
    </div>

  </div>
  <script type="module" src="src/main.js"></script>

</body>
<script>

  const toggleButton = document.getElementById('toggleButton');
    const clues = document.querySelectorAll('.clue');
    let isHidden = false;

    toggleButton.addEventListener('click', () => {
        isHidden = !isHidden;
        clues.forEach(clue => {
            clue.style.display = isHidden ? 'none' : 'block';
        });
        toggleButton.textContent = isHidden ? 'Show clues' : 'Hide clues';
    });

  // Scroll to 3D Canvas
  function scrollToQuestions() {
    const yOffset = 0;
    const element = document.getElementById("sub_container");
    const y = element.getBoundingClientRect().top + window.scrollY + yOffset;
    window.scrollTo({ top: y, behavior: 'smooth' })
    //document.getElementById("earthCanvas").scrollIntoView({block: "start", behavior: "smooth"});
  }

</script>
