<body class="relative flex items-center justify-center min-h-screen bg-center bg-cover bg-no-repeat"
    style="background-image: url('/EarthGuesser/assets/welcomeBG.png')">
    <!-- Blurred overlay -->
    <div class="absolute inset-0 bg-scenebackgroundcolor/10 backdrop-blur-sm" aria-hidden="true"></div>

    <!-- Menu container -->
    <div
        class="relative z-10 text-white text-center bg-scenebackgroundcolor/90 backdrop-blur-xl rounded-2xl p-10 shadow-2xl w-[90%] max-w-lg -mt-50">
        <ul translate="no" class="inline-block mb-4">
            <li
                class="inline-block text-4xl bg-[url('/EarthGuesser/textures/flag_set_transparent.png')] bg-clip-text text-transparent bg-cover bg-center">
                G</li>
            <li
                class="inline-block text-4xl bg-[url('/EarthGuesser/textures/flag_set_transparent.png')] bg-clip-text text-transparent bg-cover bg-center">
                L</li>
            <li
                class="inline-block text-4xl bg-[url('/EarthGuesser/textures/flag_set_transparent.png')] bg-clip-text text-transparent bg-cover bg-center">
                O</li>
            <li
                class="inline-block text-4xl bg-[url('/EarthGuesser/textures/flag_set_transparent.png')] bg-clip-text text-transparent bg-cover bg-center">
                B</li>
            <li
                class="inline-block text-4xl bg-[url('/EarthGuesser/textures/flag_set_transparent.png')] bg-clip-text text-transparent bg-cover bg-center">
                E</li>
            <span> </span>
            <li class="inline-block text-4xl text-white">guess</li>
        </ul>

        <div class="flex flex-col items-center mb-6">
            <div class="flex items-center text-2xl font-semibold mt-6">
                Choose the game mode
            </div>
        </div>

        <div class="flex flex-col items-center">
            <!-- Button -->
            <div class="mb-6 flex items-center justify-between gap-3 rounded-2xl p-2 cursor-pointer">
                <div id="game1"
                    class="w-60 py-3 rounded-lg font-medium text-lg bg-slate-800 hover:bg-cyan-600 transition-all duration-300 flex flex-row items-center justify-center">

                    <h1 class="">Today's quiz</h1>

                </div>
            </div>



            <div class="rounded-2xl p-2 ">
                <button id="game2"
                    class=" cursor-pointer w-60 py-3 rounded-lg font-medium text-lg bg-slate-800 hover:bg-slate-600 transition-all duration-300 flex flex-row items-center justify-center">
                    <div class="relative ml-2 group">
                        
                        <h1 class="">Random quiz</h1>

                        <!-- Tooltip -->
                        <div class="absolute left-1/2 transform -translate-x-1/2 bottom-full mb-2 hidden group-hover:block
                        bg-gray-800 text-white text-sm px-3 py-2 rounded shadow-lg whitespace-nowrap z-50">
                            Will be available soon.
                        </div>

                    </div>
                </button>
                <div class="relative w-60 mx-auto mt-4">

                    <!-- Dropdown Button -->
                    <button id="continentDropdownBtn"
                        class=" cursor-pointer w-full bg-slate-800 text-white py-3 px-4 rounded-lg shadow hover:bg-slate-600 flex justify-between items-center ">
                        <div class="relative ml-2 group">
                        
                        <h1>Select region</h1>

                        <!-- Tooltip -->
                        <div class="absolute left-1/2 transform -translate-x-1/2 bottom-full mb-2 hidden group-hover:block
                        bg-gray-800 text-white text-sm px-3 py-2 rounded shadow-lg whitespace-nowrap z-50">
                            Will be available soon.
                        </div>

                    </div>
                        
                        <svg class="w-5 h-5 transition-transform duration-200" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>

                    <!-- Dropdown Menu -->
                    <div id="continentDropdownMenu"
                        class="absolute w-full bg-slate-900 rounded-lg shadow-lg max-h-0 transition-all duration-300 z-50 overflow-hidden">

                        <button
                            class="w-full text-left px-4 py-3 hover:bg-cyan-600 flex justify-between items-center text-white">
                            <h1>World</h1>
                            <img class="size-5" src="/EarthGuesser/assets/earth.png">
                        </button>
                        <button
                            class="w-full text-left px-4 py-3 hover:bg-cyan-600 flex justify-between items-center text-white">
                            Africa
                            <img class="w-5 h-5" src="/EarthGuesser/assets/africa.png" alt="">
                        </button>

                        <button
                            class="w-full text-left px-4 py-3 hover:bg-cyan-600 flex justify-between items-center text-white">
                            Europe
                            <img class="w-5 h-5" src="/EarthGuesser/assets/europe.png" alt="">
                        </button>

                        <button
                            class="w-full text-left px-4 py-3 hover:bg-cyan-600 flex justify-between items-center text-white">
                            Asia
                            <img class="w-5 h-5" src="/EarthGuesser/assets/asia.png" alt="">
                        </button>

                        <button
                            class="w-full text-left px-4 py-3 hover:bg-cyan-600 flex justify-between items-center text-white">
                            North America
                            <img class="w-5 h-5" src="/EarthGuesser/assets/northamerica.png" alt="">
                        </button>

                        <button
                            class="w-full text-left px-4 py-3 hover:bg-cyan-600 flex justify-between items-center text-white">
                            South America
                            <img class="w-5 h-5" src="/EarthGuesser/assets/southamerica.png" alt="">
                        </button>

                        <button
                            class="w-full text-left px-4 py-3 hover:bg-cyan-600 flex justify-between items-center text-white">
                            Oceania
                            <img class="w-5 h-5" src="/EarthGuesser/assets/oceania.png" alt="">
                        </button>

                    </div>
                </div>
            </div>
            <div class="w-full mt-4 md:mt-14 gap-4 group">


            </div>
            <div class="relative mt-2 group inline-block">
                <div class="md:text-md text-sm md:mb-4 md:mt-4">developed by <span class="font-bold">charwelldev</span>
                </div>
                <!-- Hover element -->
                <div class="flex flex-row justify-center items-center mt-4">
                    <h1 class="mr-4">Credits</h1>
                    <img class="inline-block text-white h-6 w-6 rounded cursor-pointer "
                        src="/EarthGuesser/assets/elements.png"></img>

                </div>

                <!-- Tooltip -->
                <div class="absolute group mb-2 hidden group-hover:block
                        bg-gray-800 text-white text-sm px-3 py-2 rounded shadow-lg whitespace-nowrap z-50">

                    <div>Icons <a class="text-cyan-500" href="https://www.flaticon.es/iconos-gratis/continente"
                            title="continente iconos">amoghdesign - Flaticon</a> and <a class="text-cyan-500"
                            href="https://www.flaticon.es/iconos-gratis/info" title="info iconos">Anggara - Flaticon</a>
                        </br></div></br>
                    <div>Model <a class="text-cyan-500" href="/EarthGuesser/license.poly2tri.txt"
                            title="license poly2tri">&copy; 2009-2018 Poly2Tri </a>and <a class="text-cyan-500"
                            href="https://github.com/meshpro/pygalmesh?tab=GPL-3.0-1-ov-file"
                            title="pygal mesh">pygalmesh</a></div></br>
                    <div>3D Web library <a class="text-cyan-500" href="https://threejs.org/" title="threeJS">threeJS</a>
                    </div></br>
                </div>

            </div>


        </div>
    </div>

</body>

</html>
